    const SECRET_PASSKEY = "12345";

    function App() {
      const [words, setWords] = useState(() => {
        const savedWords = localStorage.getItem('korean_dictionary_app');
        return savedWords ? JSON.parse(savedWords) : initialData;
      });

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedChapter, setSelectedChapter] = useState('All');
      const [selectedIds, setSelectedIds] = useState([]);

      // Form States
      const [krInput, setKrInput] = useState('');
      const [npInput, setNpInput] = useState('');
      const [catInput, setCatInput] = useState('');
      const [chapterInput, setChapterInput] = useState('');
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        localStorage.setItem('korean_dictionary_app', JSON.stringify(words));
      }, [words]);

      // Pronunciation Function
      const speakKorean = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          utterance.rate = 0.82;
          utterance.pitch = 1.0;

          const voices = window.speechSynthesis.getVoices();
          const koreanVoice = voices.find(v => v.lang.includes('ko') || v.lang.includes('KO'));
          if (koreanVoice) {
            utterance.voice = koreanVoice;
          }

          window.speechSynthesis.speak(utterance);
        } else {
          alert("तपाईंको ब्राउजरमा Voice Sound सपोर्ट गरेन।");
        }
      };

      // Form Submit (Add / Edit)
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!krInput.trim() || !npInput.trim()) {
          alert("कृपया कोरियाली र नेपाली दुवै अर्थ लेख्नुहोस्!");
          return;
        }

        const chapNum = chapterInput !== '' ? parseInt(chapterInput) : '';

        if (editingId !== null) {
          setWords(words.map(w => 
            w.id === editingId 
              ? { ...w, kr: krInput.trim(), np: npInput.trim(), category: catInput.trim() || "", chapter: chapNum }
              : w
          ));
          setEditingId(null);
          alert("शब्द सम्पादन गरियो (Updated)!");
        } else {
          const newEntry = {
            id: Date.now(),
            kr: krInput.trim(),
            np: npInput.trim(),
            category: catInput.trim() || "",
            chapter: chapNum
          };
          setWords([newEntry, ...words]);
          alert("नयाँ शब्द थपियो!");
        }

        setKrInput('');
        setNpInput('');
        setCatInput('');
        setChapterInput('');
      };

      const handleStartEdit = (item, e) => {
        e.stopPropagation();
        setEditingId(item.id);
        setKrInput(item.kr);
        setNpInput(item.np);
        setCatInput(item.category);
        setChapterInput(item.chapter !== undefined ? item.chapter : '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCancelEdit = () => {
        setEditingId(null);
        setKrInput('');
        setNpInput('');
        setCatInput('');
        setChapterInput('');
      };

      // Click to Toggle Selection
      const handleToggleSelect = (id) => {
        if (selectedIds.includes(id)) {
          setSelectedIds(selectedIds.filter(item => item !== id));
        } else {
          setSelectedIds([...selectedIds, id]);
        }
      };

      const handleSelectAll = (filteredList) => {
        const filteredIds = filteredList.map(item => item.id);
        const isAllSelected = filteredIds.length > 0 && filteredIds.every(id => selectedIds.includes(id));

        if (isAllSelected) {
          setSelectedIds(selectedIds.filter(id => !filteredIds.includes(id)));
        } else {
          const newSelection = Array.from(new Set([...selectedIds, ...filteredIds]));
          setSelectedIds(newSelection);
        }
      };

      // Delete Selected
      const handleDeleteSelected = () => {
        if (selectedIds.length === 0) {
          alert("कृपया कम्तीमा एउटा शब्द Select गर्नुहोस्!");
          return;
        }

        if (confirm(`के तपाईं Select गरिएका ${selectedIds.length} वटा शब्दहरू हटाउन निश्चित हुनुहुन्छ?`)) {
          setWords(words.filter(w => !selectedIds.includes(w.id)));
          if (editingId && selectedIds.includes(editingId)) {
            handleCancelEdit();
          }
          setSelectedIds([]);
        }
      };

      // Export with Passkey
      const handleExportExcel = () => {
        const userKey = prompt("🔒 Export गर्न Passkey/Password राख्नुहोस्:");
        if (userKey === null) return;

        if (userKey !== SECRET_PASSKEY) {
          alert("❌ गलत Passkey! Export ब्लक गरियो।");
          return;
        }

        const dataToExport = selectedChapter === 'All' 
          ? words 
          : selectedChapter === 'Blank'
          ? words.filter(w => !w.chapter)
          : words.filter(w => w.chapter === parseInt(selectedChapter));

        if (dataToExport.length === 0) {
          alert("Export गर्नका लागि कुनै शब्द भेटिएन!");
          return;
        }

        const exportFormatted = dataToExport.map((item, index) => ({
          "S.N.": index + 1,
          "Chapter": item.chapter || "-",
          "Korean": item.kr,
          "Nepali": item.np,
          "Category": item.category
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportFormatted);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Words");

        const fileName = selectedChapter === 'All' 
          ? "Korean_Dictionary_All.xlsx" 
          : `Korean_Dictionary_Chapter_${selectedChapter}.xlsx`;

        XLSX.writeFile(workbook, fileName);
      };

      // Import with Passkey
      const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const userKey = prompt("🔒 Import गर्न Passkey/Password राख्नुहोस्:");
        if (userKey === null) {
          e.target.value = '';
          return;
        }

        if (userKey !== SECRET_PASSKEY) {
          alert("❌ गलत Passkey! Import ब्लक गरियो।");
          e.target.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            const importedWords = jsonData.map((row, index) => ({
              id: Date.now() + index,
              kr: row["Korean"] || row["ko"] || row["kr"] || "",
              np: row["Nepali"] || row["ne"] || row["np"] || "",
              category: row["Category"] || row["category"] || "",
              chapter: row["Chapter"] ? parseInt(row["Chapter"]) : ''
            })).filter(w => w.kr && w.np);

            if (importedWords.length > 0) {
              setWords(prev => [...importedWords, ...prev]);
              alert(`✅ ${importedWords.length} वटा शब्द सफलतापूर्वक थपियो!`);
            } else {
              alert("Excel मा डाटा भेटिएन। Header हरू: Chapter, Korean, Nepali, Category हुनुपर्छ।");
            }
          } catch (error) {
            alert("Excel फाइल अपलोड गर्दा त्रुटि भयो।");
          }
        };

        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      // Search & Chapter Filter Logic
      const filteredWords = words.filter(w => {
        const matchesChapter = selectedChapter === 'All' 
          ? true 
          : selectedChapter === 'Blank'
          ? !w.chapter
          : w.chapter === parseInt(selectedChapter);

        const matchesSearch = w.kr.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              w.np.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              w.category.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesChapter && matchesSearch;
      });

      const isAllFilteredSelected = filteredWords.length > 0 && filteredWords.every(item => selectedIds.includes(item.id));

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6">
          {/* Header */}
          <header className="bg-blue-900 text-white p-6 rounded-2xl shadow-lg mb-6 text-center border-b-4 border-amber-400">
            <h1 className="text-2xl md:text-3xl font-black tracking-wide">
              कोरियाली-नेपाली डिक्सनरी 
            </h1>
            <p className="text-xs md:text-sm text-blue-200 mt-1">
              Chapterwise Dictionary with Accurate Pronunciation
            </p>
          </header>

          {/* Search, Filter & Tools */}
          <div className="bg-white p-4 rounded-xl shadow border border-slate-200 mb-6">
            <div className="flex justify-between items-center mb-3 border-b pb-2">
              <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">खोज तथा फिल्टर</span>
              
              <div className="flex items-center gap-3">
                <button
                  onClick={handleExportExcel}
                  title="Export Excel"
                  className="bg-transparent text-lg hover:scale-110 active:scale-95 transition opacity-70 hover:opacity-100"
                >
                  📊
                </button>
                <label
                  title="Import Excel"
                  className="bg-transparent text-lg hover:scale-110 active:scale-95 cursor-pointer transition opacity-70 hover:opacity-100"
                >
                  📂
                  <input
                    type="file"
                    accept=".xlsx, .xls, .csv"
                    onChange={handleImportExcel}
                    className="hidden"
                  />
                </label>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="col-span-1">
                <label className="block text-xs font-bold text-slate-600 mb-1">📖 Chapter अनुसार हेर्नुहोस्:</label>
                <select
                  value={selectedChapter}
                  onChange={(e) => setSelectedChapter(e.target.value)}
                  className="w-full p-3 border border-slate-300 rounded-xl font-bold bg-amber-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500"
                >
                  <option value="All">All Chapters (1-60)</option>
                  <option value="Blank">Select Chapter</option>
                  {Array.from({ length: 60 }, (_, i) => i + 1).map((num) => (
                    <option key={num} value={num}>
                      Chapter {num}
                    </option>
                  ))}
                </select>
              </div>

              <div className="col-span-1 md:col-span-2">
                <label className="block text-xs font-bold text-slate-600 mb-1">🔍 खोज्नुहोस् (Search):</label>
                <div className="relative">
                  <input
                    type="text"
                    placeholder="कोरियाली वा नेपालीमा खोज्नुहोस्..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-4 pr-10 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none font-bold text-slate-800"
                  />
                  {searchTerm && (
                    <button
                      onClick={() => setSearchTerm('')}
                      className="absolute inset-y-0 right-0 pr-3 text-xs font-bold text-slate-400 hover:text-slate-600"
                    >
                      ✖ Clear
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* Dynamic Form */}
          <div className={`p-5 rounded-xl shadow border mb-6 transition ${
            editingId !== null ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'
          }`}>
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                {editingId !== null ? '✏️ शब्द सम्पादन गर्नुहोस्' : '➕ नयाँ शब्द थप्नुहोस्'}
              </h3>
              {editingId !== null && (
                <button
                  onClick={handleCancelEdit}
                  className="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded font-bold text-slate-700"
                >
                  रद्द (Cancel)
                </button>
              )}
            </div>

            <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-5 gap-3">
              <select
                value={chapterInput}
                onChange={(e) => setChapterInput(e.target.value)}
                className="p-2.5 border rounded-lg text-sm font-bold bg-white text-slate-700"
              >
                <option value="">Select Chapter:-</option>
                {Array.from({ length: 60 }, (_, i) => i + 1).map((num) => (
                  <option key={num} value={num}>Chapter {num}</option>
                ))}
              </select>

              <input
                type="text"
                placeholder="कोरियाली शब्द"
                value={krInput}
                onChange={(e) => setKrInput(e.target.value)}
                className="p-2.5 border rounded-lg text-sm font-bold bg-white"
              />
              <input
                type="text"
                placeholder="नेपाली अर्थ"
                value={npInput}
                onChange={(e) => setNpInput(e.target.value)}
                className="p-2.5 border rounded-lg text-sm bg-white"
              />
              <input
                type="text"
                placeholder="Category"
                value={catInput}
                onChange={(e) => setCatInput(e.target.value)}
                className="p-2.5 border rounded-lg text-sm bg-white"
              />
              <button
                type="submit"
                className={`font-bold py-2.5 px-4 rounded-lg shadow text-sm transition text-white ${
                  editingId !== null ? 'bg-amber-600 hover:bg-amber-700' : 'bg-emerald-600 hover:bg-emerald-700'
                }`}
              >
                {editingId !== null ? '💾 अपडेट' : '➕ Save'}
              </button>
            </form>
          </div>

          {/* Word List with Click-to-Select */}
          <div className="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
            {/* Action Bar */}
            <div className="bg-slate-800 text-white px-5 py-3 flex flex-wrap justify-between items-center gap-2 text-sm">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => handleSelectAll(filteredWords)}
                  className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded border border-slate-500 text-xs font-bold transition"
                >
                  {isAllFilteredSelected ? "सबै Unselect गर्नुहोस्" : "सबै Select गर्नुहोस्"}
                </button>
                <span className="text-xs text-slate-300">
                  (जम्मा: {filteredWords.length} | Select भएका: {selectedIds.length})
                </span>
              </div>

              {selectedIds.length > 0 && (
                <button
                  onClick={handleDeleteSelected}
                  className="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow flex items-center gap-1 transition"
                >
                  🗑️ Select गरिएका हटाउनुहोस् ({selectedIds.length})
                </button>
              )}
            </div>

            {filteredWords.length === 0 ? (
              <div className="p-8 text-center text-slate-500 font-bold">
                कुनै शब्द भेटिएन।
              </div>
            ) : (
              <div className="divide-y divide-slate-100 select-none">
                {filteredWords.map((item) => {
                  const isSelected = selectedIds.includes(item.id);
                  return (
                    <div 
                      key={item.id} 
                      onClick={() => handleToggleSelect(item.id)}
                      className={`p-4 flex flex-wrap items-center justify-between gap-4 cursor-pointer transition border-l-4 ${
                        isSelected 
                          ? 'bg-blue-50/80 border-blue-600 shadow-inner' 
                          : 'hover:bg-slate-50 border-transparent'
                      }`}
                    >
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className={`text-xl font-black ${isSelected ? 'text-blue-900' : 'text-slate-900'}`}>
                            {item.kr}
                          </span>
                          {item.category && (
                            <span className="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded">
                              {item.category}
                            </span>
                          )}
                        </div>
                        <p className="text-base font-bold text-emerald-700">{item.np}</p>
                      </div>

                      {/* Buttons */}
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            speakKorean(item.kr);
                          }}
                          className="p-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg border border-blue-200 text-xs font-bold flex items-center gap-1"
                        >
                          🔊 
                        </button>
                        <button
                          onClick={(e) => handleStartEdit(item, e)}
                          className="p-2 bg-amber-50 text-amber-700 hover:bg-amber-100 rounded-lg border border-amber-200 text-xs font-bold"
                        >
                          ✏️ 
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
